<script>
'use strict';
/* ============ dom / canvas ============ */
const cv=document.getElementById('game');
const VW=640,VH=400;
const mctx=cv.getContext('2d');
mctx.imageSmoothingEnabled=false;
let bcv=null,bctx=null;
let ctx=mctx;
let W=VW,H=VH;
let ZBUF=new Float32Array(W);
const $=id=>document.getElementById(id);
const boxEl=$('box'),ovEl=$('overlay'),statsEl=$('stats'),msgEl=$('msg'),hintEl=$('hint'),
      fillEl=$('fill'),hnumEl=$('hnum'),ammoEl=$('ammo'),vigEl=$('vig'),wlistEl=$('wlist'),
      mmCv=$('minimap'),mm=mmCv.getContext('2d'),
      feedEl=$('feed'),mapnameEl=$('mapname'),wfillEl=$('wfill'),wnumEl=$('wnum'),
      bossEl=$('bossbar'),bfillEl=$('bfill'),bossNameEl=document.querySelector('#bossbar .lbl'),sfillEl=$('sfill'),nadesEl=$('nades'),
      buffsEl=$('buffs'),statspanEl=$('statspanel'),ctlpanelEl=$('ctlpanel'),hudEl=$('hud');
mm.imageSmoothingEnabled=false;

/* render scale (perf) */
function setScale(s){
  W=Math.round(VW*s);H=Math.round(VH*s);ZBUF=new Float32Array(W);
  if(s<1){ if(!bcv){bcv=mk(W);bcv.height=H;bctx=bcv.getContext('2d');bctx.imageSmoothingEnabled=false;} ctx=bctx; }
  else bcv=null,ctx=mctx;
}

/* ============ helpers ============ */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mk=(w,h=w)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};

/* fit window, keep 8:5 */
function fit(){
  const ar=VW/VH;let w=innerWidth,h=innerHeight;
  if(w/h>ar)w=Math.floor(h*ar);else h=Math.floor(w/ar);
  boxEl.style.width=w+'px';boxEl.style.height=h+'px';
}
addEventListener('resize',fit);fit();

/* ============ audio (synth) ============ */
let actx=null,master=null,droneNodes=null;
function ensureAudio(){
  if(!actx){
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A)return;
    actx=new A();master=actx.createGain();master.gain.value=G.muted?0:0.45;master.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume();
  if(!droneNodes&&actx){
    try{
      const g=actx.createGain();g.gain.value=0.014;
      const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=180;
      [50,50.7,100.3].forEach(fr=>{const o=actx.createOscillator();o.type='sine';o.frequency.value=fr;o.connect(f);o.start();});
      f.connect(g);g.connect(master);droneNodes=g;
    }catch(e){}
  }
}
function tone(f,type,dur,peak=0.2,slide=0,delay=0){
  if(!actx)return;const t0=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(peak,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);
}
function noise(dur,peak=0.3,fc=1000,delay=0){
  if(!actx)return;const t0=actx.currentTime+delay;
  const len=Math.max(1,actx.sampleRate*dur|0),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=actx.createBufferSource();s.buffer=buf;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const g=actx.createGain();g.gain.value=peak;
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);
}
const SHOOT_SND={
  pistol:()=>{noise(0.09,0.5,900);tone(170,'square',0.09,0.28,-110);},
  smg:()=>{noise(0.05,0.38,1500);tone(230,'square',0.05,0.2,-70);},
  shotgun:()=>{noise(0.16,0.7,520);tone(85,'sine',0.2,0.42,-45);},
  rifle:()=>{noise(0.08,0.5,1100);tone(140,'square',0.08,0.3,-95);},
  heavy:()=>{noise(0.15,0.8,380);tone(58,'sine',0.24,0.5,-28);},
};
const sEmpty =()=>tone(1100,'square',0.03,0.1);
const sReloadW=w=>{const n=Math.min(4,Math.ceil(w.mag/10));for(let i=0;i<n;i++)tone(300+i*90,'square',0.035,0.13,0,i*0.18);};
const sHit   =()=>{tone(250,'square',0.05,0.2,-90);noise(0.04,0.18,2400);};
const sCrit  =()=>{tone(880,'square',0.06,0.22,200);noise(0.04,0.2,3000);};
const sDie   =p=>{tone(330+p*40,'sawtooth',0.32,0.26,-270);noise(0.22,0.22,700);};
const sHurt  =()=>{tone(90,'sine',0.25,0.5,-45);noise(0.12,0.28,420);};
const sFoe   =d=>{const v=clamp(0.3-d*0.015,0.04,0.3);noise(0.06,v,1300);tone(230,'square',0.05,v*0.6,-70);};
const sWave  =()=>{tone(440,'square',0.09,0.16);setTimeout(()=>tone(660,'square',0.14,0.16),110);};
const sRush  =()=>{tone(200,'sawtooth',0.3,0.22,120);};
const sBoss  =()=>{tone(70,'sawtooth',1.2,0.4,40);tone(140,'square',0.8,0.2,-60,0.2);};
const sClear =()=>[523,659,784,1046].forEach((f,i)=>tone(f,'square',0.12,0.16,i*95));
const sPickup=k=>{const f={health:520,medkit:620,ammo:440,shield:700,overclock:880,double:990,slow:390,w:660}[k]||660;
  tone(f,'square',0.07,0.18);tone(f*1.5,'square',0.09,0.16,0,0.07);};
const sPing  =d=>tone(1400,'sine',0.15,clamp(0.2-d*0.01,0.03,0.2),-300);
const sSwish =()=>noise(0.08,0.25,2600);
const sBoom  =()=>{noise(0.5,0.9,300);tone(45,'sine',0.6,0.7,-25);};
const sBounce=()=>{tone(220,'sine',0.05,0.15,-80);};
const sTick  =(d)=>tone(2000,'square',0.02,clamp(0.15-d*0.01,0.02,0.15));
const sJingle=()=>[660,880,1320].forEach((f,i)=>tone(f,'square',0.08,0.16,0,i*0.07));
const sFoot  =s=>noise(0.03,0.04+s*0.02,260);
const sBeat  =()=>{tone(55,'sine',0.09,0.4);tone(50,'sine',0.09,0.3,0,0.14);};
const sDash  =()=>noise(0.12,0.2,900);
const sSwitch=()=>tone(500,'square',0.03,0.1);
const sEmptyReload=()=>{};

/* ============ map (procedural) ============ */
const STATIC_MAP=[
"########################",
"#......................#",
"#......................#",
"#..XXXX....##....XXXX..#",
"#..XXXX....##....XXXX..#",
"#......................#",
"#......###....###......#",
"#......#........#......#",
"#......#..XXXX..#......#",
"#......#..X..X..#......#",
"#......#..XXXX..#......#",
"#......#........#......#",
"#......###....###......#",
"#......................#",
"#..XXXX....##....XXXX..#",
"#..XXXX....##....XXXX..#",
"#......................#",
"#......................#",
"#......................#",
"#..##....####....##....#",
"#..##....####....##....#",
"#......................#",
"#......................#",
"########################"];
const MW=24,MH=24;
let MAP=STATIC_MAP.slice();
let SPOTS=[];
const isWall=(x,y)=>x<0||y<0||x>=MW||y>=MH?true:(MAP[y][x]==='#'||MAP[y][x]==='X');
const solid=(x,y,r)=>isWall(Math.floor(x-r),Math.floor(y-r))||isWall(Math.floor(x+r),Math.floor(y-r))||isWall(Math.floor(x-r),Math.floor(y+r))||isWall(Math.floor(x+r),Math.floor(y+r));
function tryMove(o,dx,dy){
  if(dx&&!solid(o.x+dx,o.y,0.22))o.x+=dx;
  if(dy&&!solid(o.x,o.y+dy,0.22))o.y+=dy;
}
function hasLOS(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/0.2));
  for(let i=1;i<n;i++){const t=i/n;if(isWall(Math.floor(x0+(x1-x0)*t),Math.floor(y0+(y1-y0)*t)))return false;}
  return true;
}
const FOGTINTS=[
  {fog:'rgba(6,7,12,',   bg:'rgba(90,110,160,0.04)',  grid:'rgba(150,138,110,'},
  {fog:'rgba(10,7,4,',   bg:'rgba(200,120,60,0.04)',  grid:'rgba(180,130,80,'},
  {fog:'rgba(4,6,10,',   bg:'rgba(120,140,190,0.04)', grid:'rgba(130,140,160,'},
];
const NAME_A=['STARFALL','VOIDKEEP','CINDER','MOONHOLM','DUSKREACH','EMBER','IRONVEIL','NIGHTFORGE','AETHER','GALAX'];
const NAME_B=['KEEP','HOLD','BASTION','SANCTUM','WATCH','COURT','RAMPART','HALL','VAULT','SPIRE'];
function genMap(){
  for(let attempt=0;attempt<80;attempt++){
    const g=Array.from({length:MH},()=>Array(MW).fill('.'));
    for(let x=0;x<MW;x++){g[0][x]='#';g[MH-1][x]='#';}
    for(let y=0;y<MH;y++){g[y][0]='#';g[y][MW-1]='#';}
    const nBlocks=11+(Math.random()*6|0);
    for(let i=0;i<nBlocks;i++){
      const w=2+(Math.random()*3|0),h=2+(Math.random()*3|0);
      const x=1+(Math.random()*(MW-2-w)|0),y=1+(Math.random()*(MH-2-h)|0);
      const ch=Math.random()<0.5?'#':'X';
      for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)g[y+dy][x+dx]=ch;
    }
    const nDom=6+(Math.random()*8|0);
    for(let i=0;i<nDom;i++){
      const x=2+(Math.random()*(MW-5)|0),y=2+(Math.random()*(MH-5)|0);
      const ch=Math.random()<0.5?'#':'X';
      if(Math.random()<0.5){g[y][x]=ch;g[y][x+1]=ch;}else{g[y][x]=ch;g[y+1][x]=ch;}
    }
    const cc=[];
    for(let y=6;y<18;y++)for(let x=6;x<18;x++)if(g[y][x]==='.')cc.push([x,y]);
    if(cc.length<10)continue;
    const [sx,sy]=cc[Math.random()*cc.length|0];
    const seen=new Set([sx+','+sy]);const q=[[sx,sy]];
    while(q.length){const [x,y]=q.pop();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(g[ny]&&g[ny][nx]==='.'&&!seen.has(nx+','+ny)){seen.add(nx+','+ny);q.push([nx,ny]);}
      }}
    let open=0;
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(g[y][x]==='.')open++;
    if(open-seen.size>4)continue;
    if(open<180)continue;
    const far=[];
    seen.forEach(k=>{const [x,y]=k.split(',').map(Number);if((x-sx)**2+(y-sy)**2>49)far.push([x,y]);});
    if(far.length<16)continue;
    const spots=[];
    while(spots.length<20&&far.length){
      const [x,y]=far.splice(Math.random()*far.length|0,1)[0];
      if(spots.some(s=>(s[0]-x)**2+(s[1]-y)**2<4))continue;
      spots.push([x+0.5,y+0.5]);
    }
    if(spots.length<10)continue;
    const picks=[];
    while(picks.length<4&&far.length){
      const [x,y]=far.splice(Math.random()*far.length|0,1)[0];
      if((x-sx)**2+(y-sy)**2<36)continue;
      if(picks.some(s=>(s[0]-x)**2+(s[1]-y)**2<64))continue;
      picks.push([x+0.5,y+0.5]);
    }
    while(picks.length<4&&far.length){const [x,y]=far.splice(Math.random()*far.length|0,1)[0];picks.push([x+0.5,y+0.5]);}
    if(picks.length<4)continue;
    const pows=[];
    const POWK=['health','health','ammo','shield','medkit','overclock','double','slow'];
    while(pows.length<4&&far.length){
      const [x,y]=far.splice(Math.random()*far.length|0,1)[0];
      pows.push({x:x+0.5,y:y+0.5,kind:POWK[Math.random()*POWK.length|0]});
    }
    const lights=[];
    for(let i=0;i<5;i++){
      const [x,y]=far.splice(Math.random()*far.length|0,1)||[12,12];
      lights.push({x:x+0.5,y:y+0.5});
    }
    return {map:g.map(r=>r.join('')),spawn:[sx+0.5,sy+0.5],spots,picks,pows,lights,
      tint:FOGTINTS[Math.random()*FOGTINTS.length|0],
      name:NAME_A[Math.random()*NAME_A.length|0]+' '+NAME_B[Math.random()*NAME_B.length|0],
      seed:(Math.random()*9999)|0};
  }

function calcView(){
  const dirX=Math.cos(P.a),dirY=Math.sin(P.a);
  const zoom=1+0.55*P.adsAmt;
  const f=0.66/zoom;
  VIEW={dirX,dirY,planeX:-dirY*f,planeY:dirX*f,horizon:H/2+P.pitch,zoom};
}
function castRay(rx,ry){
  let mapX=Math.floor(P.x),mapY=Math.floor(P.y);
  const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
  let stepX,stepY,sdx,sdy;
  if(rx<0){stepX=-1;sdx=(P.x-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-P.x)*ddx;}
  if(ry<0){stepY=-1;sdy=(P.y-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-P.y)*ddy;}
  let side=0,tile='#';
  for(let i=0;i<160;i++){
    if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;}else{sdy+=ddy;mapY+=stepY;side=1;}
    if(isWall(mapX,mapY)){tile=MAP[mapY][mapX];break;}
  }
  const dist=side===0?(sdx-ddx):(sdy-ddy);
  return {dist:Math.max(0.02,dist),side,tile};
}
function screenProj(wx,wy){
  if(!VIEW)return null;
  const dx=wx-P.x,dy=wy-P.y;
  if(dx===0&&dy===0)return null;
  const det=VIEW.planeX*VIEW.dirY-VIEW.dirX*VIEW.planeY;
  if(det===0)return null;
  const inv=1/det;
  const tx=inv*(VIEW.dirY*dx-VIEW.dirX*dy);
  const ty=inv*(-VIEW.planeY*dx+VIEW.planeX*dy);
  if(!isFinite(tx)||!isFinite(ty)||ty<0.1)return null;
  return {x:(W/2)*(1+tx/ty),y:VIEW.horizon,hpp:(H/ty)*VIEW.zoom,dist:Math.hypot(dx,dy)};
}

function shoot(){
  const w=P.weapons[P.cur];const W0=WEAPONS[w.wi];
  if(P.reloadT>0||P.fireT>0||P.meleeT>0)return;
  if(w.mag<=0){sEmpty();startReload();return;}
  w.mag--;P.fireT=W0.fire*(P.buffs.over>0?1/1.5:1);
  P.recoil=1;G.stats.shots++;
  G.muzzleT=0.07;G.muzzleOff=0;
  const crit=Math.random()<0.15;
  const dmg=W0.dmg*(P.buffs.double>0?2:1)*(crit?1.5:1)*(P.adsAmt>0.5?1.25:1);
  const spread=W0.spread*(P.adsAmt>0.5?0.4:1);
  for(let p=0;p<W0.pellets;p++){
    const a=P.a+rand(-spread,spread);
    const dx=Math.cos(a),dy=Math.sin(a);
    const hit=castRay(dx,dy);
    let best=null,bestT=hit.dist;
    for(const e of enemies){
      if(e.spawnT>0.3)continue;
      const ex=e.x-P.x,ey=e.y-P.y;
      const t=ex*dx+ey*dy;
      if(t<0.1||t>bestT)continue;
      const px=P.x+dx*t,py=P.y+dy*t;
      const rr=0.42*e.sc+0.15;
      if((e.x-px)*(e.x-px)+(e.y-py)*(e.y-py)<rr*rr){best=e;bestT=t;}
    }
    let ix,iy;
    if(best){
      G.stats.hits++;
      const dd=dmg*rand(0.9,1.1);
      best.hp-=dd;best.hurtT=0.15;
      G.stats.dmg+=dd;
      G.stats.kp[W0.id]=(G.stats.kp[W0.id]||0)+dd;
      tryMove(best,dx*0.05,dy*0.05);
      addFloat(best.x,best.y,crit?'CRIT':'',crit?'#ffd24d':'#eaf6ff');
      if(crit)sCrit();else sHit();
      P.hitmarkT=0.12;
      ix=best.x;iy=best.y;
      if(best.hp<=0)killEnemy(best,W0.id);
    }else{
      const hx=P.x+dx*hit.dist,hy=P.y+dy*hit.dist;
      for(let i=0;i<3;i++)parts.push({x:hx,y:hy,z:0.5+rand(-0.1,0.1),dx:rand(-1,1),dy:rand(-1,1),dz:rand(0,1.5),life:.25,max:.25,color:W0.trc,size:1.5});
      ix=hx;iy=hy;
    }
    tracers.push({x0:P.x+dx*0.3,y0:P.y+dy*0.3,x1:ix,y1:iy,wall:!best,life:0.06,max:0.06,color:W0.trc});
  }
  SHOOT_SND[W0.id]();
  G.shake+=W0.shake*0.3;
}

  const e0=ETYPE[e.type];

  else if(P.streak===8){showFloat(P.x,P.y,'DEADEYE','#ff4d6a');sJingle();}

function explode(x,y,r,power,src){
  sBoom();G.exploT=0.18;G.shake+=3*power;
  for(const e of enemies.slice()){
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<r){
      e.hp-=45*power*(1-d/r*0.6);e.hurtT=0.2;e.stun=Math.max(e.stun,0.5);
      const kx=(e.x-x)/(d||1),ky=(e.y-y)/(d||1);
      tryMove(e,kx*0.5*power,ky*0.5*power);
      if(e.hp<=0)killEnemy(e,'explosion');
    }
  }
  if(src==='player'){
    const d=Math.hypot(P.x-x,P.y-y);
    if(d<r)hurtPlayer(30*power*(1-d/r*0.5),null,null);
  }
  for(let i=0;i<26;i++){const a=rand(0,6.28),s=rand(1,4)*power;
    parts.push({x,y,z:0.3+rand(0,.3),dx:Math.cos(a)*s,dy:Math.sin(a)*s,dz:rand(0,3),life:rand(.4,.9),max:.9,color:(i%3?'#ffb066':'#fff'),size:2+rand(0,2)});}
}
function hurtPlayer(d,sx,sy){

  if(d<=0)return;
  P.hp-=d;P.hurtT=0.4;P.streak=0;G.waveDamage+=d;G.shake+=2;
  sHurt();
  if(sx!=null&&sy!=null)P.dmgInd={ang:Math.atan2(sy-P.y,sx-P.x),t:1};
  if(P.hp<=0){P.hp=0;playerDeath();}

function doMelee(){

function doDodge(){
  if(!P||P.dodgeCd>0)return;
  P.dodgeT=0.22;P.dodgeCd=1.5;
  let dx=0,dy=0;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  if(keys['w']||keys['arrowup']){dx+=ca;dy+=sa;}
  if(keys['s']||keys['arrowdown']){dx-=ca;dy-=sa;}
  if(keys['a']||keys['arrowleft']){dx+=sa;dy-=ca;}
  if(keys['d']||keys['arrowright']){dx-=sa;dy+=ca;}
  const l=Math.hypot(dx,dy);
  if(l>0){P.dodgeDX=dx/l;P.dodgeDY=dy/l;}else{P.dodgeDX=ca;P.dodgeDY=sa;}
  sDash();

function startReload(){

function pickupWeapon(wi){

function applyPowerup(kind){
  if(kind==='health')P.hp=Math.min(MAXHP,P.hp+25);
  else if(kind==='medkit')P.hp=Math.min(MAXHP,P.hp+60);
  else if(kind==='ammo'){for(const w of P.weapons)if(isFinite(w.reserve))w.reserve+=Math.round(WEAPONS[w.wi].reserve*0.5);P.nades=Math.min(6,P.nades+2);}
  else if(kind==='shield')P.shield=Math.min(60,P.shield+30);
  else if(kind==='overclock')P.buffs.over=10;
  else if(kind==='double')P.buffs.double=10;
  else if(kind==='slow')P.buffs.slow=4;
}

/* ============ update ============ */
function update(dt){
  // timescale
  G.ts=P.buffs.slow>0?0.5:(G.slowCam>0?0.45:1);
  G.slowCam=Math.max(0,G.slowCam-dt);
  const wdt=dt*G.ts;
  // timers
  G.shake=Math.max(0,G.shake-dt*8);
  G.exploT=Math.max(0,G.exploT-dt);
  G.pulse=Math.max(0,G.pulse-dt);
  G.spawnGrace=Math.max(0,G.spawnGrace-dt);
  G.muzzleT=Math.max(0,G.muzzleT-dt);
  msgT=Math.max(0,msgT-dt);
  // fog of war
  G.visT-=dt;
  if(G.visT<=0){
    G.visT=0.5;
    const cx=Math.floor(P.x),cy=Math.floor(P.y);
    for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++)
      if(x>=0&&y>=0&&x<MW&&y<MH)visited[y*MW+x]=1;
  }
  // buffs
  for(const b of ['over','double','slow'])if(P.buffs[b]>0)P.buffs[b]=Math.max(0,P.buffs[b]-dt);
  // ads
  P.ads=mouseRight;
  P.adsAmt+=((P.ads?1:0)-P.adsAmt)*Math.min(1,dt*12);
  // fire
  if(mouseLeft)shoot();
  if(P.fireT>0)P.fireT=Math.max(0,P.fireT-dt);
  // reload
  if(P.reloadT>0){
    P.reloadT-=dt;
    if(P.reloadT<=0){
      const w=P.weapons[P.cur];const W0=WEAPONS[w.wi];
      const take=isFinite(w.reserve)?Math.min(W0.mag-w.mag,w.reserve):W0.mag-w.mag;
      w.mag+=take;
      if(isFinite(w.reserve))w.reserve-=take;
      P.reloadT=0;
    }
  }
  // melee / dodge
  if(P.meleeT>0)P.meleeT=Math.max(0,P.meleeT-dt);
  if(P.meleeAnim>0)P.meleeAnim=Math.max(0,P.meleeAnim-dt);
  if(P.dodgeT>0)P.dodgeT=Math.max(0,P.dodgeT-dt);
  if(P.dodgeCd>0)P.dodgeCd=Math.max(0,P.dodgeCd-dt);
  // decay
  P.hitmarkT=Math.max(0,P.hitmarkT-dt);
  P.hurtT=Math.max(0,P.hurtT-dt);
  P.recoil=Math.max(0,P.recoil-dt*6);
  if(P.dmgInd)P.dmgInd.t=Math.max(0,P.dmgInd.t-dt*1.5);
  // movement
  const dirx=Math.cos(P.a),diry=Math.sin(P.a);
  let ix=0,iy=0;
  if(keys['w']||keys['arrowup']){ix+=dirx;iy+=diry;}
  if(keys['s']||keys['arrowdown']){ix-=dirx;iy-=diry;}
  if(keys['a']||keys['arrowleft']){ix+=diry;iy-=dirx;}
  if(keys['d']||keys['arrowright']){ix-=diry;iy+=dirx;}
  const il=Math.hypot(ix,iy);
  if(il>0){ix/=il;iy/=il;}
  const sprint=(keys['shift']&&il>0)?5.4:3.5;
  let mvx=ix*sprint*dt,mvy=iy*sprint*dt;
  if(P.dodgeT>0){mvx=P.dodgeDX*7.5*dt;mvy=P.dodgeDY*7.5*dt;}
  tryMove(P,mvx,mvy);
  P.grid+=Math.hypot(mvx,mvy);
  if(il>0.1||P.dodgeT>0){
    P.bob+=dt*(sprint>4?14:10);
    P.stepT-=dt;
    if(P.stepT<=0){sFoot(sprint/5.4);P.stepT=sprint>4?0.26:0.34;}
  }
  // heartbeat
  if(P.hp<=20&&P.hp>0){P.beatT-=dt;if(P.beatT<=0){sBeat();P.beatT=0.9;}}
  // pickups
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.t+=dt;
    if(Math.hypot(pk.x-P.x,pk.y-P.y)<0.7){
      if(pk.kind==='w')pickupWeapon(pk.wi);else applyPowerup(pk.kind);
      pickups.splice(i,1);
    }
  }
  // grenades
  for(let i=nadesArr.length-1;i>=0;i--){
    const n=nadesArr[i];
    n.vz-=9.8*wdt;
    const nx=n.x+n.vx*wdt,ny=n.y+n.vy*wdt;
    if(isWall(Math.floor(nx),Math.floor(n.y))){n.vx*=-0.5;n.x+=n.vx*wdt*0.5;sBounce();}
    else n.x=nx;
    if(isWall(Math.floor(n.x),Math.floor(ny))){n.vy*=-0.5;n.y+=n.vy*wdt*0.5;sBounce();}
    else n.y=ny;
    n.z+=n.vz*wdt;
    if(n.z<0.15){n.z=0.15;n.vz*=-0.45;n.vx*=0.7;n.vy*=0.7;}
    n.fuse-=wdt;n.tick-=wdt;
    if(n.tick<=0){sTick(n.fuse);n.tick=0.12;}
    if(n.fuse<=0){nadesArr.splice(i,1);explode(n.x,n.y,2.2,1.2,'player');}
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e)continue;
    const e0=ETYPE[e.type];
    e.spawnT=Math.max(0,e.spawnT-wdt);
    e.hurtT=Math.max(0,e.hurtT-wdt);
    if(e.cdT>0)e.cdT=Math.max(0,e.cdT-wdt);
    if(e.stun>0){e.stun=Math.max(0,e.stun-wdt);continue;}
    const dx=P.x-e.x,dy=P.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    if(!e.raged&&e.hp<e.maxhp*0.3){e.raged=true;if(e.type==='boss'){showFloat(e.x,e.y,'RED TIDE','#ff2244');sRush();}}
    let sp=e.sp*(e.raged?1.4:1);
    if(e0.dash){
      e.dashCD-=wdt;
      if(e.dashCD<=0&&d<8&&d>2){e.dashT=0.25;e.dashCD=rand(3,5);e.dashA=Math.atan2(dy,dx);}
    }
    let mxv,myv;
    if(e.dashT>0){
      e.dashT-=wdt;
      mxv=Math.cos(e.dashA)*sp*3;myv=Math.sin(e.dashA)*sp*3;
    }else{mxv=(dx/d)*sp;myv=(dy/d)*sp;}
    for(const o of enemies){
      if(o===e)continue;
      const ox=e.x-o.x,oy=e.y-o.y;
      const od=Math.hypot(ox,oy);
      if(od<0.8&&od>0.01){mxv+=ox/od*0.8;myv+=oy/od*0.8;}
    }
    tryMove(e,mxv*wdt,myv*wdt);
    if(d<0.5*e.sc+0.3&&e.cdT<=0){hurtPlayer(e.cdmg,e.x,e.y);e.cdT=0.8;}
    // ranged
    if(e.type==='spitter'){
      e.fireT-=wdt;
      if(e.fireT<=0&&d<12&&hasLOS(e.x,e.y,P.x,P.y)){
        const a=Math.atan2(dy,dx);
        bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,dmg:9,life:3.2,color:e0.bullet});
        e.fireT=rand(1.4,2.2);sFoe(d);
      }
    }else if(e.type==='boss'){
      if(e.burstLeft>0){
        e.burstT-=wdt;
        if(e.burstT<=0){
          const a=Math.atan2(dy,dx);
          bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,dmg:10+(G.bossTier||0)*3,life:2.5,color:'#ff8a40'});
          e.burstLeft--;e.burstT=0.13;sFoe(d);
          if(e.burstLeft<=0)e.fireT=rand(1.6,2.4);
        }
      }else{
        e.fireT-=wdt;
        if(e.fireT<=0&&d<14&&hasLOS(e.x,e.y,P.x,P.y))e.burstLeft=5+(G.bossTier||0)*2;
      }
    }
  }
  // enemy bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*wdt;b.y+=b.vy*wdt;b.life-=wdt;
    if(isWall(Math.floor(b.x),Math.floor(b.y))){
      for(let s=0;s<4;s++)parts.push({x:b.x,y:b.y,z:0.5,dx:rand(-1,1),dy:rand(-1,1),dz:rand(0,1),life:.2,max:.2,color:b.color,size:1.5});
      bullets.splice(i,1);continue;
    }
    if(Math.hypot(b.x-P.x,b.y-P.y)<0.45){hurtPlayer(b.dmg,b.x,b.y);bullets.splice(i,1);continue;}
    if(b.life<=0)bullets.splice(i,1);
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=wdt;
    p.x+=p.dx*wdt;p.y+=p.dy*wdt;p.z+=p.dz*wdt;
    p.dz-=6*wdt;
    if(p.z<0){p.z=0;p.dz*=-0.4;}
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=tracers.length-1;i>=0;i--){tracers[i].life-=wdt;if(tracers[i].life<=0)tracers.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=wdt;f.z+=f.vy*wdt;if(f.life<=0)floats.splice(i,1);}
  // wave logic
  if(!G.pendingWave&&G.spawnLeft===0&&enemies.length===0)waveCleared();
  if(G.spawnLeft>0){
    G.spawnT-=dt;
    if(G.spawnT<=0){
      const [sx,sy]=pickSpawnSpot();
      spawnEnemy(sx,sy,nextSpawnType());
      G.spawnLeft--;
      G.spawnT=clamp(1.2-G.wave*0.05,0.35,1.2);
    }
  }
  if(G.pendingWave){
    G.interT-=dt;
    if(G.interT<=0){G.pendingWave=false;startWave(G.wave+1);}
  }
}

/* ============ render ============ */
const starCv=(()=>{
  const c=mk(256,160),g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,160);
  bg.addColorStop(0,'#020207');bg.addColorStop(1,'#0b0d16');
  g.fillStyle=bg;g.fillRect(0,0,256,160);
  const neb=(x,y,r,col)=>{const ng=g.createRadialGradient(x,y,0,x,y,r);ng.addColorStop(0,col);ng.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=ng;g.fillRect(0,0,256,160);};
  neb(70,60,90,'rgba(90,60,120,0.16)');neb(190,105,110,'rgba(40,80,140,0.14)');
  for(let i=0;i<150;i++){
    const x=Math.random()*256,y=Math.random()*160,s=Math.random();
    g.fillStyle=s<0.6?'rgba(255,255,255,'+(0.3+s*0.6).toFixed(2)+')':(s<0.85?'rgba(160,200,255,'+(0.3+s*0.5).toFixed(2)+')':'rgba(255,210,130,'+(0.3+s*0.5).toFixed(2)+')');
    g.fillRect(x,y,s<0.8?1:1.6,s<0.8?1:1.6);
  }
  return c;
})();
let starPat=null;
function drawCeil(){
  const v=VIEW;
  if(!starPat)starPat=ctx.createPattern(starCv,'repeat');
  const tx=-((P.a*24)%256),ty=((P.pitch*0.6)%160);
  const rx=Math.min(0,-tx);
  ctx.save();ctx.translate(tx,ty);
  ctx.fillStyle=starPat;
  ctx.fillRect(rx,-160,W-Math.min(0,tx)+512,Math.max(1,v.horizon)+320);
  ctx.restore();
}
function drawFloor(){
  const v=VIEW;if(!v)return;
  const hor=v.horizon;
  if(hor>=H)return;
  const tex=getFloorTex();
  if(!tex)return;
  if(!flCv){
    flCv=mk(320,200);flCtx=flCv.getContext('2d');
    try{flImg=flCtx.createImageData(320,200);}catch(e){}
    if(flImg&&flImg.data)flData=new Uint32Array(flImg.data.buffer);
  }
  const dta=flData;
  if(!dta)return;
  dta.fill(0);
  if(flFogKey!==G.fogc){
    const m=G.fogc.match(/\((\d+),(\d+),(\d+)/);
    flFog=m?[+m[1],+m[2],+m[3]]:[8,8,12];flFogKey=G.fogc;
  }
  const fr=flFog[0],fg=flFog[1],fb=flFog[2];
  const fogFull=(0xff000000|(fb<<16)|(fg<<8)|fr)>>>0;
  const k=H*v.zoom*0.5;
  const px=P.x,py=P.y;
  for(let x2=0;x2<320;x2++){
    const x=x2*2;
    const camX=2*x/W-1;
    const rx=v.dirX+v.planeX*camX,ry=v.dirY+v.planeY*camX;
    const yTop=Math.max(0,Math.ceil((hor+k/ZBUF[x])/2));
    if(yTop>=200)continue;
    for(let y2=yTop;y2<200;y2++){
      const den=2*y2-hor;
      if(den<=2)continue;
      const d=k/den;
      let col;
      if(d>1024){col=fogFull;}
      else{
        const wx=px+rx*d,wy=py+ry*d;
        let tx=wx*64;tx-=Math.floor(tx);
        let ty=wy*64;ty-=Math.floor(ty);
        col=tex[(ty|0)*64+(tx|0)];
        const f=d*0.000977;
        if(f>=0.02){
          const g2=f>1?1:f;
          const r=((col&255)*(1-g2)+fr*g2)|0;
          const g=((col>>>8&255)*(1-g2)+fg*g2)|0;
          const b=((col>>>16&255)*(1-g2)+fb*g2)|0;
          col=(0xff000000|(b<<16)|(g<<8)|r)>>>0;
        }
      }
      dta[y2*320+x2]=col;
    }
  }
  flCtx.putImageData(flImg,0,0);
  ctx.drawImage(flCv,0,0,W,H);
}
function renderWalls(){
  const v=VIEW;
  for(let x=0;x<W;x++){
    const cameraX=2*x/W-1;
    const rayX=v.dirX+v.planeX*cameraX;
    const rayY=v.dirY+v.planeY*cameraX;
    const hit=castRay(rayX,rayY);
    ZBUF[x]=hit.dist;
    const lh=(H/hit.dist)*v.zoom;
    const top=v.horizon-lh/2;
    let wx=hit.side===0?P.y+hit.dist*rayY:P.x+hit.dist*rayX;
    wx-=Math.floor(wx);
    const texX=Math.floor(wx*64);
    ctx.drawImage(hit.tile==='X'?panelCv:brickCv,texX,0,1,64,x,top,1,lh);
    if(hit.side===1){ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(x,top,1,lh);}
    const fog=clamp(hit.dist/16,0,1);
    if(fog>0.02){ctx.fillStyle=G.fogc+(fog*0.93).toFixed(3)+')';ctx.fillRect(x,top,1,lh);}
    if(G.muzzleT>0){
      const off=Math.abs(wrapA(Math.atan2(rayY,rayX)-P.a-G.muzzleOff));
      if(off<0.22){
        ctx.fillStyle='rgba(255,225,160,'+(0.55*G.muzzleT*(1-off/0.22)).toFixed(3)+')';
        ctx.fillRect(x,top,1,lh);
      }
    }
  }
}
function renderLights(now){
  for(const l of lights){
    const p=screenProj(l.x,l.y);
    if(!p)continue;
    const cx=Math.floor(clamp(p.x,0,W-1));
    if(ZBUF[cx]<p.dist)continue;
    const flick=0.62+0.28*Math.sin(now*0.013+l.ph*7)+0.1*Math.sin(now*0.05+l.ph*13);
    const r=Math.max(3,p.hpp*0.22);
    const y=p.y-p.hpp*0.48;
    const grd=ctx.createRadialGradient(p.x,y,0,p.x,y,r*3);
    grd.addColorStop(0,'rgba(255,166,66,'+(0.5*flick).toFixed(3)+')');
    grd.addColorStop(0.5,'rgba(255,140,50,'+(0.25*flick).toFixed(3)+')');
    grd.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=grd;
    ctx.fillRect(p.x-r*3,y-r*3,r*6,r*6);
    const fy=y-r*0.35,fr=Math.max(2,r*0.35);
    const fg=ctx.createRadialGradient(p.x,fy,0,p.x,fy,fr);
    fg.addColorStop(0,'rgba(255,235,180,'+(0.9*flick).toFixed(3)+')');
    fg.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=fg;
    ctx.fillRect(p.x-fr,fy-fr,fr*2,fr*2);
  }
}
function drawBillboard(img,wx,wy,worldH,worldW,alpha){
  const p=screenProj(wx,wy);
  if(!p)return;
  const h=p.hpp*worldH,w=p.hpp*worldW;
  if(w<1)return;
  const x=p.x,y=p.y;
  const left=x-w/2,top=y-h/2;
  const x0=Math.max(0,Math.ceil(left)),x1=Math.min(W-1,Math.floor(left+w));
  if(x1<x0)return;
  for(let c=x0;c<=x1;c++)if(ZBUF[c]>p.dist){
    const sw=img.width/w;
    ctx.globalAlpha=alpha;
    ctx.drawImage(img,(c-left)*sw,0,Math.max(0.5,sw),img.height,c,top,1,h);
    ctx.globalAlpha=1;
    return;
  }
}
function drawSprFull(img,wx,wy,worldH,worldW,alpha){
  const p=screenProj(wx,wy);
  if(!p)return;
  const h=p.hpp*worldH,w=p.hpp*worldW;
  if(w<1)return;
  const left=p.x-w/2,top=p.y-h/2;
  const x0=Math.max(0,Math.ceil(left)),x1=Math.min(W-1,Math.floor(left+w));
  if(x1<x0)return;
  let vis=false;
  for(let c=x0;c<=x1;c++)if(ZBUF[c]>p.dist){vis=true;break;}
  if(!vis)return;
  const sw=img.width/w;
  for(let c=x0;c<=x1;c++){
    if(ZBUF[c]<=p.dist)continue;
    ctx.globalAlpha=alpha;
    ctx.drawImage(img,(c-left)*sw,0,Math.max(0.5,sw),img.height,c,top,1,h);
    ctx.globalAlpha=1;
  }
}
function drawSpr(s,now){
  if(s.kind==='e'){
    const e=s.ref;const spr=enemyCv[e.type];
    const sc=e.sc*(1+e.spawnT*0.35);
    drawSprFull(e.hurtT>0?spr.w:spr.c,e.x,e.y,0.9*sc,0.9*sc,clamp(1.2-e.spawnT*1.6,0,1));
    const p=screenProj(e.x,e.y);
    if(p&&e.hp<e.maxhp&&ETYPE[e.type].score>=1.5){
      const bw=p.hpp*0.75*e.sc,bx=p.x-bw/2,by=p.y-p.hpp*0.55*e.sc;
      ctx.globalAlpha=0.85;
      ctx.fillStyle='#2a0a12';ctx.fillRect(bx-1,by-1,bw+2,4);
      ctx.fillStyle=EACC[e.type];ctx.fillRect(bx,by,bw*clamp(e.hp/e.maxhp,0,1),2);
      ctx.globalAlpha=1;
    }
  }else if(s.kind==='p'){
    const pk=s.ref;
    const bob=Math.sin(now*0.004+pk.t*3)*0.04;
    const img=pk.kind==='w'?weaponPickupCvs[pk.wi]:powPickupCvs[pk.kind];
    drawSprFull(img,pk.x,pk.y,0.62+bob,0.62+bob,1);
  }else if(s.kind==='n'){
    drawSprFull(nadeCv,s.ref.x,s.ref.y,0.3,0.3,1);
    const p=screenProj(s.ref.x,s.ref.y);

      ctx.globalAlpha=0.9;ctx.fillStyle='#ff8a3d';
      ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;
    }
  }else if(s.kind==='b'){
    drawSprFull(bulletCv,s.ref.x,s.ref.y,0.24,0.24,1);
  }
}
function renderTracers(){

function gunMuzzle(){
  const gs=(W/640)*1.35*(1+P.adsAmt*0.18);
  let gx=W/2+Math.sin(P.bob)*6*(1-P.adsAmt*0.6);
  gx+=(W/2-gx)*P.adsAmt*0.3;
  let gyOff=Math.cos(P.bob*2)*4*(1-P.adsAmt*0.6);
  if(P.reloadT>0)gyOff+=Math.sin((1-P.reloadT/P.reloadTotal)*Math.PI)*30;
  if(P.meleeAnim>0)gyOff-=24;
  gyOff-=P.recoil*8;
  gx-=P.recoil*5;
  return {gx,gyOff,gs,fy:H-140*gs*0.85+gyOff};
}
function renderGun(now){

function renderCrosshair(){
  const cx=W/2,cy=H/2;
  const W0=WEAPONS[P.weapons[P.cur].wi];
  const col=WACC[W0.id];
  const spread=8+P.recoil*22-(P.adsAmt*4);
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.moveTo(cx-spread-6,cy);ctx.lineTo(cx-spread,cy);
  ctx.moveTo(cx+spread,cy);ctx.lineTo(cx+spread+6,cy);
  ctx.moveTo(cx,cy-spread-6);ctx.lineTo(cx,cy-spread);
  ctx.moveTo(cx,cy+spread);ctx.lineTo(cx,cy+spread+6);
  ctx.stroke();
  if(P.reloadT>0){
    const prog=1-P.reloadT/P.reloadTotal;
    ctx.strokeStyle='#fff';
    ctx.beginPath();ctx.arc(cx,cy,15,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);ctx.stroke();
  }
  if(P.hitmarkT>0){
    ctx.strokeStyle='#fff';ctx.globalAlpha=P.hitmarkT/0.12;
    ctx.beginPath();
    ctx.moveTo(cx-8,cy-8);ctx.lineTo(cx+8,cy+8);
    ctx.moveTo(cx+8,cy-8);ctx.lineTo(cx-8,cy+8);
    ctx.stroke();
  }
  if(P.dodgeCd>0){
    const cd=1-P.dodgeCd/1.5;
    ctx.strokeStyle='rgba(255,210,77,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy+24,6,-Math.PI/2,-Math.PI/2+cd*Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function renderArrows(){
  let count=0;
  for(const e of enemies){
    if(count>=6)break;
    const dx=e.x-P.x,dy=e.y-P.y;
    const d=Math.hypot(dx,dy);
    if(d<4)continue;
    const p=screenProj(e.x,e.y);
    if(p&&p.x>-20&&p.x<W+20)continue;
    const rel=wrapA(Math.atan2(dy,dx)-P.a);
    if(Math.abs(rel)>Math.PI*0.5)continue;
    const r=70;
    const ax=W/2+Math.sin(rel)*r;
    const ay=H/2-Math.cos(rel)*r*0.8;
    ctx.save();ctx.translate(ax,ay);ctx.rotate(rel);
    ctx.fillStyle=EACC[e.type];ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(6,4);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();
    ctx.restore();
    count++;
  }
  ctx.globalAlpha=1;
}
function renderDmgInd(){
  if(!P.dmgInd||P.dmgInd.t<=0)return;
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.rotate(P.dmgInd.ang-P.a);
  ctx.globalAlpha=P.dmgInd.t*0.7;
  ctx.strokeStyle='#ff3344';ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(0,0,64,-0.5,0.5);ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=1;
}
function renderFullFX(now){
  vigEl.style.opacity=clamp(P.hurtT*1.5+(P.hp>0&&P.hp<15?0.25:0),0,1);
  if(P.hp<=15&&P.hp>0){
    const p=0.12+0.12*Math.sin(now*0.008);
    ctx.fillStyle='rgba(255,0,30,'+p.toFixed(3)+')';ctx.fillRect(0,0,W,H);
  }
  if(G.exploT>0){
    ctx.fillStyle='rgba(255,200,120,'+(G.exploT*2.2).toFixed(3)+')';ctx.fillRect(0,0,W,H);
  }
  if(G.ts<1){
    ctx.fillStyle='rgba(80,150,255,0.10)';ctx.fillRect(0,0,W,H);
  }
  if(G.pulse>0){
    ctx.strokeStyle='rgba(255,210,120,'+G.pulse.toFixed(3)+')';
    ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);
  }
}
function render(now){
  if(!P)return;
  calcView();
  const sx=(Math.random()*2-1)*G.shake,sy=(Math.random()*2-1)*G.shake;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(sx,sy);
  drawCeil();
  renderWalls();
  drawFloor();
  ctx.fillStyle=G.bgTint;ctx.fillRect(-20,-20,W+40,H+40);
  renderLights(now);
  const spr=[];
  for(const e of enemies)spr.push({wx:e.x,wy:e.y,d:Math.hypot(e.x-P.x,e.y-P.y),kind:'e',ref:e});
  for(const pk of pickups)spr.push({wx:pk.x,wy:pk.y,d:Math.hypot(pk.x-P.x,pk.y-P.y),kind:'p',ref:pk});
  for(const n of nadesArr)spr.push({wx:n.x,wy:n.y,d:Math.hypot(n.x-P.x,n.y-P.y),kind:'n',ref:n});
  for(const b of bullets)spr.push({wx:b.x,wy:b.y,d:Math.hypot(b.x-P.x,b.y-P.y),kind:'b',ref:b});
  for(const m of marks)spr.push({wx:m.x,wy:m.y,d:Math.hypot(m.x-P.x,m.y-P.y),kind:'m',ref:m});
  spr.sort((a,b)=>b.d-a.d);
  for(const s of spr)drawSpr(s,now);
  renderTracers();
  renderParts();
  renderFloats();
  renderGun(now);
  renderCrosshair();
  renderArrows();
  renderDmgInd();
  ctx.restore();
  renderFullFX(now);
  if(bcv){
    mctx.clearRect(0,0,VW,VH);
    mctx.drawImage(bcv,0,0,VW,VH);
  }
}

/* ============ minimap ============ */
function drawMinimap(){
  if(!P)return;
  const S=mmCv.width,cs=S/MW;
  mm.clearRect(0,0,S,S);
  mm.fillStyle='#0c0a08';mm.fillRect(0,0,S,S);
  const px=P.x*cs,py=P.y*cs;
  const drawCells=()=>{
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      if(!visited[y*MW+x])continue;
      const ch=MAP[y][x];
      if(ch==='#'){mm.fillStyle='#4a4438';mm.fillRect(x*cs,y*cs,cs,cs);}
      else if(ch==='X'){mm.fillStyle='#33302a';mm.fillRect(x*cs,y*cs,cs,cs);}
    }
  };
  const drawDots=()=>{
    for(const pk of pickups){
      if(!visited[Math.floor(pk.y)*MW+Math.floor(pk.x)])continue;
      mm.fillStyle=pk.kind==='w'?'#ffd24d':POW_STYLE[pk.kind];
      mm.fillRect(pk.x*cs-1.5,pk.y*cs-1.5,3,3);
    }
    for(const n of nadesArr){mm.fillStyle='#ff8a3d';mm.fillRect(n.x*cs-1,n.y*cs-1,2,2);}
    for(const e of enemies){
      if(Math.hypot(e.x-P.x,e.y-P.y)>10)continue;
      mm.fillStyle=EACC[e.type];mm.fillRect(e.x*cs-1.5,e.y*cs-1.5,3,3);
    }
  };
  const drawPlayer=()=>{
    mm.save();
    mm.fillStyle='#ffd24d';
    mm.beginPath();mm.moveTo(5,0);mm.lineTo(-3,3);mm.lineTo(-3,-3);mm.closePath();mm.fill();
    mm.globalAlpha=0.14;mm.beginPath();mm.moveTo(0,0);mm.arc(0,0,16,-0.55,0.55);mm.closePath();mm.fill();
    mm.restore();mm.globalAlpha=1;
  };
  if(G.mapRotate){
    mm.save();
    mm.translate(S/2,S/2);
    mm.rotate(-P.a-Math.PI/2);
    mm.translate(-px,-py);
    drawCells();drawDots();
    mm.restore();
    mm.save();mm.translate(S/2,S/2);mm.rotate(P.a);drawPlayer();mm.restore();
  }else{
    drawCells();drawDots();
    mm.save();mm.translate(px,py);mm.rotate(P.a);drawPlayer();mm.restore();
  }
}

/* ============ hud ============ */
const fmtTime=t=>{const s=t|0;return ((s/60)|0)+':'+String(s%60).padStart(2,'0');};
function updateHud(){
  if(!P)return;
  hnumEl.textContent=Math.ceil(P.hp);
  fillEl.style.width=(P.hp/MAXHP*100)+'%';
  fillEl.style.background=P.hp>30?'#6fd08f':P.hp>15?'#ffd24d':'#ff5468';
  sfillEl.style.width=(P.shield/60*100)+'%';
  const w=P.weapons[P.cur];
  ammoEl.textContent=w.mag+' / '+(isFinite(w.reserve)?w.reserve:'\u221E');
  ammoEl.style.color=(isFinite(w.reserve)&&w.mag<WEAPONS[w.wi].mag*0.25)?'#ff5468':'#d8cbaa';
  nadesEl.textContent='\u25CF NAD '+P.nades;
  const alive=enemies.length+G.spawnLeft;
  const tot=G.waveTotal||1;
  wnumEl.textContent=(G.waveTotal-alive)+'/'+G.waveTotal;
  wfillEl.style.width=(clamp(1-alive/tot,0,1)*100)+'%';
  const boss=enemies.find(e=>e.type==='boss');
  if(boss){bossEl.style.display='block';bfillEl.style.width=(clamp(boss.hp/boss.maxhp,0,1)*100)+'%';
    bossNameEl.textContent='\u25C8 '+BOSS_NAMES[clamp(G.bossTier||0,0,BOSS_NAMES.length-1)]+' \u25C8';}
  else bossEl.style.display='none';
  const curWi=P.weapons[P.cur].wi;
  let wl='';
  for(let i=0;i<5;i++){
    if(!P.weapons.some(x=>x.wi===i))continue;
    wl+='<span style="color:'+(i===curWi?'#ffd24d':'#7a6f52')+';font-weight:'+(i===curWi?'bold':'normal')+'">'+(i+1)+'</span> ';
  }
  wlistEl.innerHTML=wl;
  let bf='';
  if(P.buffs.over>0)bf+='OVERCLOCK '+Math.ceil(P.buffs.over)+'s  ';
  if(P.buffs.double>0)bf+='DOUBLE DMG '+Math.ceil(P.buffs.double)+'s  ';
  if(P.buffs.slow>0)bf+='SLOW-MO '+Math.ceil(P.buffs.slow)+'s  ';
  buffsEl.textContent=bf;
  mapnameEl.textContent=G.name+' \u00B7 #'+G.seed;
  statsEl.innerHTML='SCORE '+G.score+'<br>KILLS '+G.kills+'<br>WAVE '+G.wave;
  msgEl.style.opacity=clamp(msgT,0,1);
  feedEl.innerHTML=feedArr.map(t=>'<div>'+t+'</div>').join('');
  if(G.showStats&&G.state==='playing'){
    const s=G.stats;
    const acc=s.shots?Math.round(s.hits/s.shots*100):0;
    statspanEl.style.display='block';
    statspanEl.innerHTML='TIME '+fmtTime(s.time)+'<br>KILLS '+G.kills+'<br>DAMAGE '+Math.round(s.dmg)+
      '<br>SHOTS '+s.shots+'<br>ACCURACY '+acc+'%<br>HIGH SCORE '+G.best+'<br>FPS '+G.fps;
  }else statspanEl.style.display='none';
  ctlpanelEl.style.display=G.showCtl?'block':'none';
}
ctlpanelEl.innerHTML='WASD move · SHIFT sprint · MOUSE aim<br>LMB fire · RMB aim-down-sight<br>1-5 weapons · R reload · F melee · G grenade<br>SPACE dodge roll · TAB stats · H controls<br>M mute · T minimap rotate';

/* ============ arcade leaderboard ============ */
const Arcade=(()=>{
  const LSKEY='vk_name';
  let name='';
  try{name=(localStorage.getItem(LSKEY)||'').trim();}catch(e){}
  let online=false;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function fetchJson(url,opts){
    try{
      const r=await fetch(url,opts);
      if(!r.ok)throw 0;
      online=true;
      return await r.json();
    }catch(e){online=false;return null;}
  }
  return {
    esc,
    get name(){return name;},
    setName(n){name=String(n||'').replace(/\s+/g,' ').trim().slice(0,16);try{localStorage.setItem(LSKEY,name);}catch(e){}},
    board(limit){return fetchJson('api/leaderboard?limit='+(limit||10));},
    stats(){return fetchJson('api/stats');},
    submit(res){return fetchJson('api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({name},res))});},
    isOnline(){return online;}
  };
})();
async function loadBoard(){
  const el=ovEl.querySelector('.lb');
  if(!el)return;
  const [b,s]=await Promise.all([Arcade.board(10),Arcade.stats()]);
  if(el!==ovEl.querySelector('.lb')||G.state!=='menu')return;
  if(!b){el.innerHTML='<h3>TOP KINGS</h3><div class="lbwait">HALL OFFLINE — PLAY LOCALLY</div>';return;}
  let rows='';
  for(let i=0;i<Math.min(5,b.top.length);i++){
    const e=b.top[i];
    const me=(e.name||'').toLowerCase()===Arcade.name.toLowerCase()?' class="me"':'';
    rows+='<tr'+me+'><td class="rk">'+e.rank+'</td><td>'+Arcade.esc(e.name)+'</td><td>'+e.score.toLocaleString()+'</td><td>W'+e.wave+'</td><td>'+e.kills+'</td></tr>';
  }
  if(!rows)rows='<tr><td class="rk">1</td><td colspan="4">NO KINGS YET — BE THE FIRST BLED HERE</td></tr>';
  const st=s?(s.games+' RUNS · '+s.players+' KINGS · '+s.totalKills.toLocaleString()+' KILLS · BEST WAVE '+s.bestWave):'';
  el.innerHTML='<h3>TOP KINGS</h3><table>'+rows+'</table>'+(st?'<div class="lbstats">'+st+'</div>':'');
}
async function submitScore(){
  const el=ovEl.querySelector('.lb');
  if(!el)return;
  if(!Arcade.name){el.innerHTML='<h3>HALL OF NAMES</h3><div class="lbwait">SET A NAME ON THE MENU TO CLIMB THE RANKS</div>';return;}
  const res=await Arcade.submit({score:G.score,kills:G.kills,wave:G.wave,time:G.stats.time|0,shots:G.stats.shots,hits:G.stats.hits});
  if(el!==ovEl.querySelector('.lb'))return;
  if(!res){el.innerHTML='<h3>HALL OF NAMES</h3><div class="lbwait">THE HALL IS UNREACHABLE — SCORE LOST</div>';return;}
  let html='<h3>HALL OF NAMES</h3>';
  if(res.rank===1)html+='<div class="gold">BOARD LEADER — THOU ART THE FIRST KING</div>';
  else if(res.rank<=10)html+='<div class="gold">RANK #'+res.rank+' IN THE TOP 10</div>';
  else html+='<div class="gold">RANK #'+res.rank+'</div>';
  let rows='';
  for(const e of res.top){
    const me=(e.name||'').toLowerCase()===Arcade.name.toLowerCase()?' class="me"':'';
    rows+='<tr'+me+'><td class="rk">'+e.rank+'</td><td>'+Arcade.esc(e.name)+'</td><td>'+e.score.toLocaleString()+'</td><td>W'+e.wave+'</td><td>'+e.kills+'</td></tr>';
  }
  el.innerHTML=html+'<table>'+rows+'</table>';
}

/* ============ overlays ============ */
function showOv(state){
  G.state=state;
  ovEl.style.display='flex';
  ovEl.className=state==='menu'?'solid':'';
  hudEl.style.display=state==='menu'?'none':'';
  if(state==='menu'){
    ovEl.innerHTML='<h1>VOID KEEP</h1><h2 class="sub">SPACE-MEDIEVAL RAYCAST FPS</h2>'+
      '<input id="pname" maxlength="16" placeholder="ENTER YOUR NAME" spellcheck="false" autocomplete="off" value="'+Arcade.esc(Arcade.name)+'"'+(Arcade.name?'':' class="need"')+ '>'+
      '<div class="blink">'+(Arcade.name?'CLICK TO START':'ENTER YOUR NAME, KING')+'</div>'+
      '<div class="lb"><h3>TOP KINGS</h3><div class="lbwait">SCROLLING THE HALL OF NAMES…</div></div>';
    const nm=ovEl.querySelector('#pname');
    nm.addEventListener('input',()=>{Arcade.setName(nm.value);nm.classList.toggle('need',!Arcade.name);const bl=ovEl.querySelector('.blink');if(bl)bl.textContent=Arcade.name?'CLICK TO START':'ENTER YOUR NAME, KING';});
    nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryStart();}});
    loadBoard();
  }else if(state==='dead'){
    const rec=G.score>=G.best&&G.score>0;
    ovEl.innerHTML='<h1 class="red">SLAIN</h1>'+
      '<div class="tag">WAVE '+G.wave+' · KILLS '+G.kills+' · '+(G.stats.time|0)+'S IN THE VOID</div>'+
      '<h2>SCORE '+G.score+'</h2>'+
      (rec?'<div class="gold">NEW RECORD</div>':'<div class="gold">HIGH SCORE '+G.best+'</div>')+
      '<div class="lb"><h3>HALL OF NAMES</h3><div class="lbwait">CARVING YOUR DEEDS…</div></div>'+
      '<div class="blink">ENTER — NEW MAP &nbsp;·&nbsp; Q — MENU</div>';
    submitScore();
  }else if(state==='pause'){
    ovEl.innerHTML='<h1>PAUSED</h1>'+
      '<div class="tag">WAVE '+G.wave+' · SCORE '+G.score+'</div>'+
      '<div class="ctl">T — sensitivity ('+G.sens.toFixed(1)+'x)<br>X — render scale ('+(W/VW)+'x)<br>R — restart · ESC — resume</div>'+
      '<div class="blink">CLICK TO RESUME</div>';
  }
  if(document.exitPointerLock)document.exitPointerLock();
}
function requestLock(){
  try{
    const p=cv.requestPointerLock&&cv.requestPointerLock();
    if(p&&p.catch)p.catch(()=>{if(G.state==='playing')pause();});
  }catch(e){if(G.state==='playing')pause();}
}
function tryStart(){
  if(!Arcade.name){
    if(G.state!=='menu')showOv('menu');
    const nm=ovEl.querySelector('#pname');
    if(nm){nm.classList.add('need');nm.focus();}
    return;
  }
  startGame();requestLock();
}
function resume(){G.state='playing';ovEl.style.display='none';hudEl.style.display='';requestLock();}
function pause(){if(G.state!=='playing')return;showOv('pause');}

/* ============ input ============ */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  ensureAudio();
  if(G.state==='dead'){
    if(k==='enter'){tryStart();}
    else if(k==='q')showOv('menu');
    return;
  }
  if(G.state==='pause'){
    if(k==='r'){tryStart();}
    else if(k==='t'){G.sens=G.sens>=2?0.5:G.sens+0.5;showOv('pause');}
    else if(k==='x'){setScale(W===VW?0.5:1);showOv('pause');}
    else if(k==='escape')resume();
    return;
  }
  if(G.state!=='playing')return;
  if(k===' '){e.preventDefault();doDodge();return;}
  keys[k]=true;
  if(k==='r')startReload();
  else if(k>='1'&&k<='5')switchWeapon(+k-1);
  else if(k==='f')doMelee();
  else if(k==='g')throwNade();
  else if(k==='tab'){e.preventDefault();G.showStats=!G.showStats;}
  else if(k==='h')G.showCtl=!G.showCtl;
  else if(k==='m'){G.muted=!G.muted;if(master)master.gain.value=G.muted?0:0.45;}
  else if(k==='t')G.mapRotate=!G.mapRotate;
  else if(k==='escape')pause();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseLeft=false;mouseRight=false;});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==cv)return;
  P.a+=e.movementX*0.0022*G.sens;
  P.pitch=clamp(P.pitch-e.movementY*0.4,-40,40);
});
cv.addEventListener('mousedown',e=>{
  ensureAudio();
  if(G.state==='menu'||G.state==='dead'){tryStart();return;}
  if(G.state==='pause'){resume();return;}
  if(G.state!=='playing')return;
  if(e.button===0)mouseLeft=true;
  if(e.button===2)mouseRight=true;
});
addEventListener('mouseup',e=>{
  if(e.button===0)mouseLeft=false;
  if(e.button===2)mouseRight=false;
});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement!==cv&&G.state==='playing')pause();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.state==='playing')pause();
});

/* ============ loop ============ */
let last=0,fpsT=0,fpsC=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!last)last=now;
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  fpsT+=dt;fpsC++;
  if(fpsT>=0.5){G.fps=Math.round(fpsC/fpsT);fpsT=0;fpsC=0;}
  G.stats.time+=dt;
  if(G.state==='playing')update(dt);
  else if(G.state==='menu')P.a+=dt*0.1;
  render(now);
  drawMinimap();
  updateHud();
}

/* ============ init ============ */
gm=genMap();
MAP=gm.map.slice();SPOTS=gm.spots;
G.fogc=gm.tint.fog;G.gridC=gm.tint.grid;G.bgTint=gm.tint.bg;G.name=gm.name;G.seed=gm.seed;
visited=new Uint8Array(MW*MH);
lights=gm.lights.map(l=>({x:l.x,y:l.y,ph:rand(0,6)}));
P=newPlayer(gm.spawn[0],gm.spawn[1]);
showOv('menu');
requestAnimationFrame(frame);

/* ============ test export ============ */
globalThis.__t={
  get G(){return G;},get P(){return P;},get MAP(){return MAP;},get SPOTS(){return SPOTS;},get VIEW(){return VIEW;},get ZBUF(){return ZBUF;},
  get enemies(){return enemies;},get bullets(){return bullets;},get pickups(){return pickups;},
  get parts(){return parts;},get nades(){return nadesArr;},get floats(){return floats;},
  get visited(){return visited;},
  keys,setFiring(v){mouseLeft=v;},
  startGame,startWave,genMap,isWall,spawnEnemy,hurtPlayer,update,render,
  shoot,explode,doMelee,throwNade,switchWeapon,startReload,setScale,castRay,screenProj,
  WEAPONS,ETYPE,
};
</script>
